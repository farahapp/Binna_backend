[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.bcmath", "php84Extensions.tokenizer", "php84Extensions.fileinfo", "php84Extensions.openssl", "composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

# FIX(2026-10-23): Removed config:cache/route:cache/view:cache from build phase.
# Running artisan cache commands at build time freezes empty env var values
# (APP_KEY, DB_*) into the cache before Hangar injects runtime secrets,
# causing Laravel to exit with code 1 on startup.
# Cache commands are now run at start time after env vars are injected.

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-3000}"
